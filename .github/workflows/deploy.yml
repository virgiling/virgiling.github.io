name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild static friend-feed snapshots without browser-side RSS/CORS requests.
  schedule:
    - cron: '23 */6 * * *'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_BASE: /
      FRIENDS_REFRESH: '1'
    steps:
      - name: Check out framework and pinned content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # BLOGS needs read-only Contents access to this repo and blog_content.
          token: ${{ secrets.BLOGS }}
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Set up font tooling
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          python-version: '3.12'
          enable-cache: false

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Restore public friend-feed snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .astro/friends
          key: friend-feeds-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: friend-feeds-${{ runner.os }}-

      - name: Check, test, build, and verify static output
        run: bun run validate

      - name: Verify built routes and resources over HTTP
        run: bun run verify:http

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
